name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  PUBLIC_DIR: dist/public

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/prerender
            tools/github-share

      - name: Install yawn
        run: cargo install yawn-cli --git https://github.com/yawn-rs/yawn --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: GitHub share WASM
        run: npm run build:wasm

      - name: Repo cards
        run: cargo run --release --manifest-path tools/prerender/Cargo.toml -- repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: yawn build --static

      - name: Social cards
        run: cargo run --release --manifest-path tools/prerender/Cargo.toml -- ${{ env.PUBLIC_DIR }}

      - name: Routes
        run: cp cloudflare/_routes.json ${{ env.PUBLIC_DIR }}/_routes.json

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.PUBLIC_DIR }} --project-name meetzli --branch main
