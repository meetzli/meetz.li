[package]
name = "meetzli"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.8.0-alpha.1", features = ["web", "router"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }

[profile.dev]
opt-level = 0
debug = 1
incremental = true
split-debuginfo = "unpacked"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
