[package]
name = "meetzli"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
yawn-web = { git = "https://github.com/yawn-rs/yawn" }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }

[workspace]

[profile.dev]
debug = false
opt-level = "s"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
